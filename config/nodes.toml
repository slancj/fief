# fief topology: ONE PLACE for per-node config (plaintext, committed).
# Secrets live in config/secrets.yaml (SOPS+age encrypted); each node below
# lists which secret KEYS it needs — values never appear here.
# Fan-out (scripts/fanout.py) pushes secrets+vars to HF/Render;
# hosts render dotenv via `fief config export --node <name> > .env`.

[nodes.hf]
# Hugging Face Space hub (test2). Secrets -> Space Secrets, vars -> Variables.
vars = { TAIL_HOSTNAME = "fief-hf", TAIL_SERVE = "1080,1081" }
secrets = ["CHISEL_AUTH", "SSH_PUBKEY", "TAILSCALE_AUTHKEY"]

[nodes.render]
# Render web service (fief-relay). Secrets+vars -> service env (PUT per key).
vars = { TAIL_HOSTNAME = "fief-render", TAIL_SERVE = "1080,1081" }
secrets = ["CHISEL_AUTH", "SSH_PUBKEY", "TAILSCALE_AUTHKEY"]

[nodes.pi]
# Raspberry Pi at friend's house. Render locally: fief config export --node pi.
vars = { TAIL_HOSTNAME = "fief-pi", TAIL_SERVE = "", TAIL_ROUTES = "" }
secrets = ["CHISEL_AUTH", "TAILSCALE_AUTHKEY"]

[nodes.laptop]
# Local dev/consumer box. Same export flow as pi.
vars = { TAIL_HOSTNAME = "fief-laptop" }
secrets = ["CHISEL_AUTH"]
