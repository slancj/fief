# Secret scanning + lint on every commit. Install once per clone:
#   pre-commit install
# (get pre-commit via: nix-shell -p pre-commit, pipx install pre-commit, ...)
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--config", "gitleaks.toml"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: ["src", "tests", "scripts", "hf-space/app.py"]
      - id: ruff-format
        args: ["src", "tests", "scripts", "hf-space/app.py"]
