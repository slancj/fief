# fief-relay hub — deployed from this repo via Blueprint.
# Apply: dashboard → New → Blueprint → slancj/fief (workspace needs
# GitHub connected). Set CHISEL_AUTH at apply time; it is never committed.
services:
  - type: web
    name: fief-relay
    runtime: docker
    plan: free # sleeps after ~15 min idle; first connect wakes it (~30s cold start)
    region: oregon
    dockerfilePath: ./image/Dockerfile
    dockerContext: .
    # No dockerCommand override: image/entrypoint.sh reads $PORT (injected
    # by Render) and $CHISEL_AUTH and execs chisel server with
    # --reverse (Windows R:socks) + --socks5 (Render-egress proxy).
    envVars:
      - key: CHISEL_AUTH
        sync: false # dashboard secret, format user:secret
