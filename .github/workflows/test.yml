# CI: lint + tests on every push/PR.
name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python-env
        with:
          sync: "true"
      - name: Lint
        run: uv run --frozen ruff check src tests scripts hf-space/app.py
      - name: Format check
        run: uv run --frozen ruff format --check src tests scripts hf-space/app.py
      - name: Tests
        run: uv run --frozen pytest -q
