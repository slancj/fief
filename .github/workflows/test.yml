# CI: lint + tests on every push/PR.
name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Sync deps
        run: uv sync --frozen
      - name: Lint
        run: uv run --frozen ruff check src tests scripts hf-space/app.py
      - name: Format check
        run: uv run --frozen ruff format --check src tests scripts hf-space/app.py
      - name: Tests
        run: uv run --frozen pytest -q
