# Auto-deploy hf-space/ to Hugging Face on push to main.
#
# One-time setup (nothing secret is committed here):
#   1. HF Settings -> Access Tokens: fine-grained token with Write on your
#      (private) Space, e.g. "<owner>/<name>". A full-access token also
#      works but can delete repos — prefer fine-grained.
#   2. GitHub repo -> Settings -> Secrets and variables -> Actions:
#        secret   HF_TOKEN    = the token from step 1
#        variable HF_SPACE_ID = "<owner>/<name>"
# First run creates the Space if missing (private, gradio SDK) — unless
# the API refuses creation (observed: 402 Payment Required), in which case
# create the Space manually (private, Gradio SDK) and re-run: sync proceeds.
name: deploy-hf-space
on:
  push:
    branches: [main]
    paths:
      - "hf-space/**"
      - "src/**"
      - "scripts/assemble_hf_space.py"
      - "scripts/sync_hf_space.py"
      - ".github/workflows/deploy-hf-space.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install huggingface_hub
        run: pip install -q huggingface_hub
      - name: Assemble Space payload
        run: python scripts/assemble_hf_space.py --out dist/space
      - name: Sync payload to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: python scripts/sync_hf_space.py
