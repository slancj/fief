[project]
name = "fief"
version = "0.1.0"
description = "Outbound-only chisel tunnel hub + clients. One codebase, deploy anywhere."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
gradio = ["gradio>=5.0"]

[project.scripts]
fief = "fief.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fief"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
